[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "testpick"
version = "0.2.1"
description = "Run only the tests a code change can affect, using a record of what each test runs"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "William Ayoade" }]
requires-python = ">=3.10"
dependencies = ["pytest>=8.2", "tomli>=2; python_version<'3.11'"]
classifiers = [
  "Framework :: Pytest",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
dev = ["pytest-xdist", "ruff", "mypy"]

[project.scripts]
testpick = "testpick.cli:main"

[project.entry-points.pytest11]
testpick = "testpick.plugin"

[tool.setuptools]
packages = ["testpick"]

[tool.setuptools.package-data]
testpick = ["py.typed"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
files = ["testpick"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p pytester"
